spring:
  application:
    name: sigcav-api

  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: SigcavHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Lima

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    time-zone: America/Lima
    locale: es_PE

  messages:
    basename: messages
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

sigcav:
  jwt:
    secret: ${JWT_SECRETO}
    expiration-seconds: ${JWT_EXPIRACION_SEGUNDOS:900}

  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRACION_DIAS:7}

  session:
    inactivity-minutes: ${SESION_INACTIVIDAD_MINUTOS:10}
    cleanup-interval-ms: ${SESION_INTERVALO_LIMPIEZA_MS:60000}

  cors:
    allowed-origins: ${CORS_ORIGENES_PERMITIDOS}

logging:
  level:
    root: INFO
    com.jmcavel.sigcav: INFO